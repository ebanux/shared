name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release contents
        run: |
          npm run verify
          git diff --exit-code -- dist packages/commerce-contract/dist
      - name: Package commerce contract
        run: |
          mkdir -p release-artifacts
          npm pack ./packages/commerce-contract --pack-destination release-artifacts
      - name: Create missing package releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create_release() {
            local tag="$1"
            local title="$2"
            local asset="${3:-}"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "${tag} already has a release; skipping."
              return
            fi

            local target_args=()
            if ! git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
              target_args=(--target "$GITHUB_SHA")
            fi

            local asset_args=()
            if [ -n "$asset" ]; then
              asset_args=("$asset")
            fi

            gh release create "$tag" "${asset_args[@]}" "${target_args[@]}" \
              --title "$title" --generate-notes
          }

          builder_version="$(node --print "require('./package.json').version")"
          commerce_version="$(node --print "require('./packages/commerce-contract/package.json').version")"
          commerce_asset="release-artifacts/ebanux-commerce-contract-${commerce_version}.tgz"
          test -f "$commerce_asset"

          create_release "v${builder_version}" "Builder Contract v${builder_version}"
          create_release "commerce-contract-v${commerce_version}" \
            "Commerce Contract v${commerce_version}" "$commerce_asset"
